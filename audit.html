<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logs de Auditoria — Plano de Contas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
    header { background: #1e40af; color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .filters { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .filter-field { display: flex; flex-direction: column; gap: 4px; }
    .filter-field label { font-size: 12px; color: #64748b; font-weight: 500; }
    .filter-field input, .filter-field select { padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; color: #1e293b; outline: none; }
    .filter-field input:focus, .filter-field select:focus { border-color: #3b82f6; }
    .btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-back { background: rgba(255,255,255,0.15); color: #fff; white-space: nowrap; }
    .btn-back:hover { background: rgba(255,255,255,0.25); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: #fff; color: #374151; border: 1px solid #e2e8f0; }
    .btn-outline:hover { background: #f8fafc; }
    .info-bar { font-size: 13px; color: #64748b; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); font-size: 13px; }
    thead { background: #f8fafc; }
    th { padding: 10px 12px; text-align: left; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
    .paginacao { display: flex; gap: 8px; align-items: center; margin-top: 14px; justify-content: flex-end; }
    .empty { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }
    .empty.erro { color: #dc2626; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    .detail-cell { max-width: 260px; white-space: pre-wrap; word-break: break-word; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <button id="btnVoltar" class="btn btn-back">&#8592; Voltar</button>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <h1>Logs de Auditoria</h1>
  </header>

  <div class="container">
    <div class="filters">
      <div class="filter-field">
        <label>De</label>
        <input type="date" id="filtroDataI"/>
      </div>
      <div class="filter-field">
        <label>At&#233;</label>
        <input type="date" id="filtroDataF"/>
      </div>
      <div class="filter-field">
        <label>Tipo</label>
        <select id="filtroEntityType">
          <option value="">Todos</option>
          <option value="conta">Conta</option>
          <option value="lancamento">Lan&#231;amento</option>
          <option value="usuario">Usu&#225;rio</option>
        </select>
      </div>
      <div class="filter-field">
        <label>A&#231;&#227;o</label>
        <select id="filtroAction">
          <option value="">Todas</option>
          <option value="login">login</option>
          <option value="failed_login">failed_login</option>
          <option value="conta_criada">conta_criada</option>
          <option value="conta_editada">conta_editada</option>
          <option value="conta_deletada">conta_deletada</option>
          <option value="lancamento_criado">lancamento_criado</option>
          <option value="lancamento_editado">lancamento_editado</option>
          <option value="lancamento_deletado">lancamento_deletado</option>
          <option value="create_user">create_user</option>
          <option value="update_user">update_user</option>
          <option value="remove_user">remove_user</option>
          <option value="reset_password">reset_password</option>
          <option value="change_password">change_password</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnBuscar">Buscar</button>
      <button class="btn btn-outline" id="btnLimpar">Limpar</button>
      <button class="btn btn-outline" id="btnExportCSV" style="margin-left:auto">&#11015; Exportar CSV</button>
    </div>

    <div class="info-bar">
      <span id="infoBar"></span>
      <div class="paginacao" id="paginacao" style="display:none">
        <button class="btn btn-outline" id="btnPrev">&#8249; Anterior</button>
        <span id="paginaInfo" style="font-size:13px;color:#64748b"></span>
        <button class="btn btn-outline" id="btnNext">Pr&#243;ximo &#8250;</button>
      </div>
    </div>

    <div id="conteudo"><div class="loading">Carregando...</div></div>
  </div>

  <script src="client/audit.js"></script>
</body>
</html>
